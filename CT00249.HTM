<FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B><I>Vorpal Sword</I></B></FONT><FONT FACE="Times New Roman" SIZE="3">
<P></P>
As with the <I>sword of sharpness</I>, the properties of a <I>vorpal blade </I>override the critical hit procedure. If the wielder rolls an 18 or higher that
meets the criteria for a critical hit without invoking the vorpal power, a
normal critical hit results.
