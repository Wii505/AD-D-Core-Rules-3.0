<A NAME="a0c38bf1"></A><FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B><I>Boots of Speed</I></B></FONT><FONT FACE="Times New Roman" SIZE="3">
<P></P>
The Armor Class bonus applies when the character chooses a half-move or
full-move combat action. Going toe-to-toe in a melee doesn’t allow the wearer of the
boots to take advantage of their defensive properties, although he can always
use the extra movement.
