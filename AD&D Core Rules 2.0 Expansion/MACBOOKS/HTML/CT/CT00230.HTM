<A NAME="04f9a347"></A><FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B><I>Haste</I></B></FONT><FONT FACE="Times New Roman" SIZE="3"><I>
<P></P>
</I>Creatures under the influence of a <I>haste</I> spell increase their base initiative and weapon speeds by two phases and
always win initiative. Their movement rates are doubled, and they gain a second set
of attacks in the very slow phase.
