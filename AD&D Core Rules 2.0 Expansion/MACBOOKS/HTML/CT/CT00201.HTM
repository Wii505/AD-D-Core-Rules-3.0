<FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B>Moonlight or Moderate Fog or Rain
<P></P>
</B></FONT><FONT FACE="Times New Roman" SIZE="3">Characters suffer a –1 penalty to attack rolls and saving throws. Since
nothing can be seen more than 100 yards (60 squares) away, spell and missile ranges
are limited; no missile scale combat can take place in an encounter.
