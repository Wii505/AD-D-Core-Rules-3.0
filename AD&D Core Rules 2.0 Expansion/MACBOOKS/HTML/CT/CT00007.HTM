<A NAME="073962ae"></A><FONT FACE="Times New Roman" COLOR="#800080" SIZE="4">Scale</FONT><FONT FACE="Times New Roman" SIZE="3"> In normal combat situations, each 1-inch square on the map represents an area
5 feet square. This is referred to as melee scale. Under certain special
circumstances, each 1-inch square can represent 5 yards. This is known as missile
scale.
