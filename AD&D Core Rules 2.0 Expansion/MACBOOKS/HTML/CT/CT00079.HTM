<A NAME="d978bd10"></A><A NAME="d978bd10"></A><FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B>Formal Morale Checks</B></FONT><FONT FACE="Times New Roman" SIZE="3">
<P></P>
A formal morale check is a comparison of a 2d10 roll against the creature’s
base Morale rating, modified for the situation. An extensive list of modifiers
appear on the DM Screen and under Morale in Chapter 9: Combat in the </FONT><FONT FACE="Times New Roman" COLOR="#008000" SIZE="3">Dungeon Master Guide</FONT><FONT FACE="Times New Roman" SIZE="3">.
