<A NAME="f881df41"></A><A NAME="f881df41"></A><FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="4">Exceptional Abilities 
<P></P>
and Movement
<P></P>
</FONT><FONT FACE="Times New Roman" SIZE="3">Characters with exceptional Strength or Dexterity scores can increase their
base movement rate beyond the normal limits of their race. Similarly, characters
with weaknesses in these areas are slower than others of their kind.
