<A NAME="e97977a5"></A><FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="4">Limited Visibility</FONT><FONT FACE="Times New Roman" SIZE="3">
<P></P>
Fighting at night or in dark settings is difficult—especially if your foe can
see better than you can. As noted in the </FONT><FONT FACE="Times New Roman" COLOR="#008000" SIZE="3">DMG</FONT><FONT FACE="Times New Roman" SIZE="3">, characters fighting in darkness or heavy fog suffer penalties to their
attack rolls, damage bonuses, and Armor Classes.
