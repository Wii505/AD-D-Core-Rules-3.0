<FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B>Full-move Actions</B></FONT><FONT FACE="Times New Roman" SIZE="3">
<P></P>
Full-move actions involve a character moving his full normal movement rate (or
even more, in some cases) before attempting other actions. Full-Move actions
include:
<P></P>

<P></P>
<FONT FACE="Symbol"><SPAN CLASS=Symbol>·</SPAN></FONT> Charge
<P></P>
<FONT FACE="Symbol"><SPAN CLASS=Symbol>·</SPAN></FONT> Move
<P></P>
<FONT FACE="Symbol"><SPAN CLASS=Symbol>·</SPAN></FONT> Run
<P></P>
<FONT FACE="Symbol"><SPAN CLASS=Symbol>·</SPAN></FONT> Sprint
<P></P>
