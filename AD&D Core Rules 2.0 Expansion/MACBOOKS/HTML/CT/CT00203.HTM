<P></P>
</B></FONT><FONT FACE="Times New Roman" SIZE="3">Characters suffer a –4 penalty to attacks, saves, and AC and receive no damage
bonus for exceptional strength. No special attacks such as disarms, backstabs,
or traps are allowed—the character can’t see his own weapon, let alone his
target.
