<P></P>

in the spell description. If a hole dug through a rampart collapses, the area
above it becomes damaged (see the <A HREF="CT00446.htm"></A></FONT><FONT FACE="Times New Roman" COLOR="#008000" SIZE="3"><A HREF="CT00446.htm">Sieges section</A></FONT><FONT FACE="Times New Roman" SIZE="3">, below).
