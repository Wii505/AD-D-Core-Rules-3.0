<A NAME="070327e5"></A><FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="4">Range</FONT><FONT FACE="Times New Roman" SIZE="3">
<P></P>
Most characters and monsters can only make melee attacks against creatures
standing in one of their front spaces. However, some weapons provide extra reach
for characters, and some monsters cover a greater area because of size.
