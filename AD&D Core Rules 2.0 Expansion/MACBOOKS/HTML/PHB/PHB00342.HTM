<A NAME="1e906ee5"></A><FONT FACE="Times New Roman" COLOR="#800080" SIZE="5"><B>Character Death 
<P></P>
</B></FONT><FONT FACE="Times New Roman" SIZE="3">When a character reaches 0 hit points, that character is slain. The character
is immediately dead and unable to do anything unless some specialized magical
effect takes precedence.
<P></P>
