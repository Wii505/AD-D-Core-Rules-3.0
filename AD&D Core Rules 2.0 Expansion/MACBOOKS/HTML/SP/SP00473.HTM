<A NAME="efd56f69"></A><A NAME="efd56f69"></A><FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B>Gaining Character Points
<P></P>
</B></FONT><FONT FACE="Times New Roman" SIZE="3">Each time a character gains an experience level, he also gains 3 to 5
character points—at the DM’s discretion—that can be used on weapon and nonweapon
proficiencies or saved for use during the game.
