<FONT FACE="Times New Roman" COLOR="#ff0000" SIZE="3"><B>Fast Healer:</B></FONT><FONT FACE="Times New Roman" SIZE="3"> This highly useful trait allows a character to recover 1 hit point of damage
within 2–12 turns of receiving a wound. Also, the character naturally heals at
a rate of 2 hit points, not 1, per day.
