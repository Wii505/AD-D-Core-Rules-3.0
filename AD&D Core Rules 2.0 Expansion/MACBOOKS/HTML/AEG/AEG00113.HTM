<FONT FACE="Times New Roman" COLOR="#000080" SIZE="3"><B>Footman's Pick</B></FONT><FONT FACE="Times New Roman" SIZE="3">
<P></P>
 The footman's version of this weapon has a longer haft (up to 5'), enabling it
to be wielded with two hands. The weapon weighs about six pounds and can be
swung with great penetrating force.
